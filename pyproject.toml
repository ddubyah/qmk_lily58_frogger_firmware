[project]
name = "qmk_trainer"
version = "0.1.0"
description = "One-handed keyboard training CLI with LED highlighting and OLED feedback"
readme = "qmk_trainer/README.md"
authors = [
    {name = "DDubyah", email = "user@example.com"},
]
dependencies = [
    "typer",
    "rich",
    "hidapi",
    "tomli ; python_version<'3.11'",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
qmk_trainer = "qmk_trainer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qmk_trainer"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "qmk_trainer/tests",
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
